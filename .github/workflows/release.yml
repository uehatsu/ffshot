name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # csproj の <Version> とタグが食い違ったまま配布しないためのガード
      - name: Check csproj version matches the tag
        shell: bash
        run: |
          csproj_version="$(dotnet msbuild src/FFShot -getProperty:Version -nologo | tr -d '\r')"
          tag_version="${{ steps.ver.outputs.version }}"
          if [ "$csproj_version" != "$tag_version" ]; then
            echo "::error::src/FFShot/FFShot.csproj の <Version> ($csproj_version) がタグ ($tag_version) と一致しません。csproj を更新してからタグを打ち直してください。"
            exit 1
          fi
          echo "version OK: $csproj_version"

      - name: Test
        run: dotnet test ffshot.sln -c Release --nologo --filter "Category!=Screen"

      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish src/FFShot -c Release -r win-x64 -o publish/win-x64 --nologo
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item README.txt publish/win-x64/
          Copy-Item LICENSE publish/win-x64/LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.txt publish/win-x64/
          Compress-Archive -Path publish/win-x64/* -DestinationPath "dist/ffshot-${{ steps.ver.outputs.version }}-win-x64.zip"
          Get-FileHash dist/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --title "ffshot ${{ steps.ver.outputs.version }}" \
            --generate-notes
